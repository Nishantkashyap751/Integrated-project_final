# Server Configuration
server.port=${PORT:8080}

# Spring DataSource (Persistent File-based H2 for Prod)
spring.datasource.url=jdbc:h2:file:./data/quantity_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=secureProdPassword123

# Spring Data JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console Configuration (Disabled in Prod)
spring.h2.console.enabled=false

# Spring Boot Security Properties
spring.security.user.name=prodadmin
spring.security.user.password=secureProdPass456

# Spring Boot Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging Configuration
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.app.quantitymeasurement=INFO
