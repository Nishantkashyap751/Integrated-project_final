# Server Configuration
server.port=${PORT:8080}

# Spring DataSource (MySQL Workbench)
spring.datasource.url=jdbc:mysql://localhost:3306/quantity_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=7988

# Spring Data JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration (Disabled)
spring.h2.console.enabled=false

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# JWT Configuration
app.jwt.secret=${JWT_SECRET:d2d2a8b273428d098e98327dbf03e23114d7a7b8e1f0e4b8a213e8e19b5b248a}
app.jwt.expiration=86400000

# Security - Public endpoints
app.security.public-paths=/api/auth/**,/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html,/actuator/health

# Spring Boot Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.app.quantitymeasurement=DEBUG
