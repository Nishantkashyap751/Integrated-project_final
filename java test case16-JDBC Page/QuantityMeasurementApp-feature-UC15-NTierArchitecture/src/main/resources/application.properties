# Database Configuration
db.url=jdbc:h2:mem:quantity_db;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:db/schema.sql'
db.driver=org.h2.Driver
db.user=sa
db.password=

# Connection Pool Configuration
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.timeoutMs=5000
db.pool.idleTimeoutMs=600000

# Application Settings
app.repository.type=DATABASE
# app.repository.type=CACHE

# Logging Configuration
logging.level.com.app.quantitymeasurement=DEBUG
logging.level.root=INFO
